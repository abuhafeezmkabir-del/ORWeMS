<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Dignified orphan care and sponsorship illustration">
  <defs>
    <linearGradient id="bgCare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgCare)"/>
  <circle cx="300" cy="185" r="140" fill="#ffffff" opacity="0.85"/>
  <!-- Shield of Protection -->
  <path d="M300 80 L380 120 V205 C380 255 330 290 300 305 C270 290 220 255 220 205 V120 Z" fill="#ffffff" stroke="#0284c7" stroke-width="6" stroke-linejoin="round"/>
  <!-- Guardian hands supporting child -->
  <path d="M255 240 C270 260 290 270 300 270 C310 270 330 260 345 240" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  <!-- Central Loving Heart -->
  <path d="M300 170 C300 155 285 140 270 140 C252 140 242 155 242 172 C242 195 275 220 300 235 C325 220 358 195 358 172 C358 155 348 140 330 140 C315 140 300 155 300 170 Z" fill="url(#heartGrad)"/>
  <!-- Radiating Care Sparks -->
  <circle cx="300" cy="115" r="6" fill="#0284c7"/>
  <circle cx="250" cy="125" r="5" fill="#059669"/>
  <circle cx="350" cy="125" r="5" fill="#059669"/>
  <!-- Text Label -->
  <text x="300" y="350" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#0f172a">Dignified Care &amp; Holistic Sponsorship</text>
  <text x="300" y="375" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Protection, Nurture &amp; Wellbeing for Every Child</text>
</svg>