<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Safe community care, solidarity, and humanitarian assistance illustration">
  <defs>
    <linearGradient id="bgComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgComm)"/>
  <circle cx="300" cy="180" r="140" fill="#ffffff" opacity="0.85"/>
  <!-- Community shelter / House outline -->
  <polygon points="300,90 390,165 370,165 370,265 230,265 230,165 210,165" fill="#f8fafc" stroke="#059669" stroke-width="5" stroke-linejoin="round"/>
  <!-- Guardian & Community Figures Holding Hands Inside Shelter -->
  <!-- Left guardian figure -->
  <circle cx="265" cy="195" r="14" fill="#0284c7"/>
  <path d="M250 245 C250 220 280 220 280 245" fill="#0284c7"/>
  <!-- Right guardian figure -->
  <circle cx="335" cy="195" r="14" fill="#0d9488"/>
  <path d="M320 245 C320 220 350 220 350 245" fill="#0d9488"/>
  <!-- Center child figure -->
  <circle cx="300" cy="208" r="11" fill="#f59e0b"/>
  <path d="M288 245 C288 226 312 226 312 245" fill="#f59e0b"/>
  <!-- Unified protective arc -->
  <path d="M245 155 C280 135 320 135 355 155" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Text Label -->
  <text x="300" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#0f172a">Safe Community &amp; Solidarity</text>
  <text x="300" y="373" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Coordinated Protection &amp; Community Accountability</text>
</svg>